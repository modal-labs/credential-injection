[project]
name = "modal-cred-proxy"
version = "0.1.0"
description = "Credential-injecting egress proxy for Modal sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "pyjwt>=2.12.1",
    "starlette>=1.0.1",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_cred_proxy"]
